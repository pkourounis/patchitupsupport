<style>
  /* ===================== PatchitUP design tokens ===================== */
  :root {
    color-scheme: light dark;
    /* one hero blue + sky→navy range */
    --blue-50:#eaf3fc; --blue-100:#d6e6f8; --blue-200:#b6d3f1;
    --blue-400:#4B90D0; --blue-500:#2A7DD1; --blue-600:#2368b4;
    --blue-700:#1b5391; --blue-900:#104679; --blue-950:#0C3155;
    --steel-500:#7E8488; --steel-300:#aeb4b8;

    --brand-primary:var(--blue-500); --brand-primary-deep:var(--blue-950);
    --brand-on-primary:#ffffff;
    --gradient-brand: linear-gradient(158deg, var(--blue-400) 0%, var(--blue-700) 55%, var(--blue-950) 100%);

    /* blue-leaning neutrals */
    --bg:#eaf1f8; --panel:#ffffff; --panel-2:#f2f7fc;
    --ink:#0f2233; --ink-2:#4a5a6a; --ink-3:#7E8488;
    --border:#dae7f2; --border-2:#e9f1f8;

    /* status — minimal, function-driven */
    --good:#1f9d63; --good-wash:#e6f5ee; --bad:#d6543f; --bad-wash:#fbeae6; --warn:#c98a12;

    /* bars */
    --bar:var(--blue-400); --bar-soft:#a9cceb; --bar-hi:var(--blue-600);

    /* shape + shadow (blue-tinted, never neutral-black) */
    --radius:18px; --radius-sm:12px; --radius-pill:999px;
    --shadow:0 1px 2px rgba(12,49,85,.06), 0 10px 26px rgba(12,49,85,.10);
    --shadow-lg:0 2px 6px rgba(12,49,85,.08), 0 18px 44px rgba(12,49,85,.16);
    --ring-brand:0 0 0 3px rgba(42,125,209,.4);

    --font:"Fira Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --ls-wider:.12em;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --brand-primary:#4a97dc; --brand-primary-deep:#0C3155; --brand-on-primary:#fff;
      --gradient-brand: linear-gradient(158deg, #2f6aa8 0%, #123a63 55%, #0a2947 100%);
      --bg:#0a1622; --panel:#10202f; --panel-2:#16293b;
      --ink:#e8f0f8; --ink-2:#9fb2c4; --ink-3:#7E8488;
      --border:#23374a; --border-2:#1c2c3d;
      --good:#35bd80; --good-wash:#12261d; --bad:#f0705c; --bad-wash:#2a1512; --warn:#e6a53a;
      --bar:#4f97d6; --bar-soft:#2c4a66; --bar-hi:#7bb8ea;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px rgba(0,0,0,.4);
      --shadow-lg:0 2px 6px rgba(0,0,0,.45), 0 20px 48px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="light"]{ --brand-primary:#2A7DD1; --brand-primary-deep:#0C3155; --brand-on-primary:#fff;
    --gradient-brand:linear-gradient(158deg,#4B90D0 0%,#1b5391 55%,#0C3155 100%);
    --bg:#eaf1f8; --panel:#fff; --panel-2:#f2f7fc; --ink:#0f2233; --ink-2:#4a5a6a; --ink-3:#7E8488;
    --border:#dae7f2; --border-2:#e9f1f8; --good:#1f9d63; --good-wash:#e6f5ee; --bad:#d6543f; --bad-wash:#fbeae6; --warn:#c98a12;
    --bar:#4B90D0; --bar-soft:#a9cceb; --bar-hi:#2368b4;
    --shadow:0 1px 2px rgba(12,49,85,.06),0 10px 26px rgba(12,49,85,.10); }
  :root[data-theme="dark"]{ --brand-primary:#4a97dc; --brand-primary-deep:#0C3155; --brand-on-primary:#fff;
    --gradient-brand:linear-gradient(158deg,#2f6aa8 0%,#123a63 55%,#0a2947 100%);
    --bg:#0a1622; --panel:#10202f; --panel-2:#16293b; --ink:#e8f0f8; --ink-2:#9fb2c4; --ink-3:#7E8488;
    --border:#23374a; --border-2:#1c2c3d; --good:#35bd80; --good-wash:#12261d; --bad:#f0705c; --bad-wash:#2a1512; --warn:#e6a53a;
    --bar:#4f97d6; --bar-soft:#2c4a66; --bar-hi:#7bb8ea;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.4); --shadow-lg:0 2px 6px rgba(0,0,0,.45),0 20px 48px rgba(0,0,0,.5); }

  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font);
    font-weight:500; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; }
  .num { font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .piu-display { font-weight:800; font-style:italic; letter-spacing:-.015em; }
  .eyebrow { font-weight:700; text-transform:uppercase; letter-spacing:var(--ls-wider); }
  :focus-visible { outline:none; box-shadow:var(--ring-brand); border-radius:8px; }

  .app { height:100vh; display:grid; grid-template-rows:auto 1fr; gap:clamp(9px,1.1vh,16px);
    padding:clamp(10px,1.3vw,20px); }

  /* ---------- Top bar ---------- */
  .bar { display:flex; align-items:center; gap:clamp(10px,1.3vw,20px); flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:12px; min-width:0; }
  .hlogo { height:clamp(40px,4.4vh,62px); display:flex; align-items:center; flex:none; }
  .hlogo img { height:100%; width:auto; max-width:min(44vw,440px); object-fit:contain; display:block; }
  .hlogo .wm { display:inline-block; font-weight:800; font-style:italic; letter-spacing:-.02em; line-height:.92;
    font-size:clamp(23px,2.5vw,38px); color:var(--blue-500); white-space:nowrap; }
  .hlogo .wm i { color:var(--blue-950); font-style:italic; }
  .hlogo .wm .tag { display:block; font-size:clamp(7.5px,.66vw,10px); font-weight:700; font-style:italic;
    color:var(--steel-500); letter-spacing:.01em; margin-top:1px; }
  .brand .divider { width:1px; align-self:stretch; margin:4px 2px; background:var(--border); }
  .title { display:flex; flex-direction:column; line-height:1.05; min-width:0; }
  .title b { font-size:clamp(14px,1.3vw,20px); }
  .title b i { color:var(--brand-primary); font-style:italic; }
  .title small { font-size:clamp(9.5px,.78vw,12px); color:var(--ink-3); margin-top:2px; }
  .spacer { flex:1 1 auto; }

  .seg { display:inline-flex; background:var(--panel); border:1px solid var(--border);
    border-radius:var(--radius-pill); padding:3px; gap:2px; box-shadow:var(--shadow); }
  .seg button { border:0; background:transparent; color:var(--ink-2); cursor:pointer; font:inherit;
    font-weight:700; font-size:clamp(11px,.82vw,13px); padding:clamp(5px,.7vh,9px) clamp(10px,.95vw,16px);
    border-radius:var(--radius-pill); white-space:nowrap; transition:background .2s,color .2s; }

<script>
/* ================= (1) helpers ================= */
const usd0 = n => n>=1000 ? '$'+Math.round(n).toLocaleString('en-US') : '$'+Math.round(n);
const usdK = n => { if(n>=1e6)return '$'+(n/1e6).toFixed(n>=1e7?1:2)+'M'; if(n>=1e4)return '$'+(n/1e3).toFixed(0)+'K'; if(n>=1000)return '$'+(n/1e3).toFixed(1)+'K'; return '$'+Math.round(n); };
const pct = n => (n*100).toFixed(1)+'%';
const int = n => Math.round(n).toLocaleString('en-US');
const clampNum = (v,a,b) => Math.max(a, Math.min(b, v));
const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function hashSeed(s){ let h=1779033703^s.length; for(let i=0;i<s.length;i++){ h=Math.imul(h^s.charCodeAt(i),3432918353); h=(h<<13)|(h>>>19);} return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function niceCeil(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10; return s*p; }

  { name:'Charlotte',      code:'CH', region:'Charlotte, NC',   tenant:'4753625109', scale:0.92, close:0.31, avgOpp:2380 },
  { name:'Lansdale',       code:'LN', region:'Lansdale, PA',    tenant:'3327763989', scale:0.78, close:0.36, avgOpp:2210 },
  { name:'Saginaw',        code:'SG', region:'Saginaw, MI',     tenant:'4095872533', scale:0.58, close:0.29, avgOpp:1980 },
];
const DAYS = 800, DAY_MS = 86400000;
const MockSource = (() => {
  const cache = new Map();
  function build(loc){
    const rnd = mulberry32(hashSeed(loc.name));
    const today = new Date(); today.setHours(0,0,0,0);
    const out = [];
    for (let i=DAYS-1; i>=0; i--){
      const t = new Date(today.getTime()-i*DAY_MS);
      const dow = t.getDay();
      const weekend = dow===0?0.35:dow===6?0.6:1;
      const seasonal = 1 + 0.16*Math.sin((t.getMonth()+1)/12*2*Math.PI - 1.1);
      const trend = 1 + 0.20*((DAYS-1-i)/DAYS);
      const noise = 0.72 + rnd()*0.56;
      const opps = Math.max(0, Math.round(6.2*loc.scale*weekend*seasonal*trend*noise));
      const avgOpp = loc.avgOpp*(0.9+rnd()*0.24)*seasonal;
      const pipelineUSD = opps*avgOpp;
      const closeR = clampNum(loc.close*(0.82+rnd()*0.4), 0.12, 0.62);
      const wins = clampNum(Math.round(opps*closeR), 0, opps);
      const avgWon = avgOpp*(1.04+rnd()*0.22);
      const salesUSD = wins*avgWon;
      const revenueUSD = salesUSD*(0.86+rnd()*0.09);
      out.push({ t, opps, wins, salesUSD, pipelineUSD, revenueUSD });
    }
    return out;
  }
  return { getDailySeries(loc){ if(!cache.has(loc.name)) cache.set(loc.name, build(loc)); return cache.get(loc.name); } };
})();

/* ================= (3) date windows ================= */
function windowFor(range, custom){
  const now = new Date(); now.setHours(23,59,59,999);
  const start = new Date(now); start.setHours(0,0,0,0);
  let from=new Date(start), to=new Date(now), label='';
  const day=start.getDay();
  switch(range){
    case 'today': label='Today'; break;
    case 'week': { const back=(day===0?6:day-1); from=new Date(start.getTime()-back*DAY_MS); label='This week'; break; }
    case 'month': from=new Date(start.getFullYear(),start.getMonth(),1); label='This month'; break;
    case 'quarter': { const q=Math.floor(start.getMonth()/3)*3; from=new Date(start.getFullYear(),q,1); label='This quarter'; break; }
    case 'year': from=new Date(start.getFullYear(),0,1); label='This year'; break;
    case 'custom': from=new Date(custom.from+'T00:00:00'); to=new Date(custom.to+'T23:59:59'); label='Custom'; break;
  }
  const span=to-from, prevTo=new Date(from.getTime()-1), prevFrom=new Date(from.getTime()-1-span);
  const fmt=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  return { from, to, prevFrom, prevTo, label, labelFull: range==='today'?`${label} · ${fmt(from)}`:`${label} · ${fmt(from)} – ${fmt(to)}` };
}

/* ================= (4) aggregation ================= */
function aggregate(series, from, to){
  let opps=0,wins=0,salesUSD=0,pipelineUSD=0,revenueUSD=0;
  for (const d of series){ if(d.t>=from&&d.t<=to){ opps+=d.opps; wins+=d.wins; salesUSD+=d.salesUSD; pipelineUSD+=d.pipelineUSD; revenueUSD+=d.revenueUSD; } }
  return { opps, wins, salesUSD, revenueUSD, closeRate:opps?wins/opps:0, closedAvgSale:wins?salesUSD/wins:0, oppJobAvg:opps?pipelineUSD/opps:0 };
}
const delta = (c,p) => p>0 ? (c-p)/p : (c>0?1:0);
const EMPTY = {opps:0,wins:0,salesUSD:0,pipelineUSD:0,revenueUSD:0};
function metricValue(a, m){ switch(m){ case 'sales':return a.salesUSD; case 'opps':return a.opps; case 'wins':return a.wins;
  case 'rate':return a.opps?a.wins/a.opps:0; default:return a.revenueUSD; } }
const metricFmt = m => (m==='opps'||m==='wins')?int : m==='rate'?pct : usdK;

/* monthly buckets → Map 'y-m' -> agg */
function monthlyMap(series){ const map=new Map();
  for(const d of series){ const k=d.t.getFullYear()+'-'+d.t.getMonth(); let a=map.get(k); if(!a){a={...EMPTY}; map.set(k,a);}
    a.opps+=d.opps; a.wins+=d.wins; a.salesUSD+=d.salesUSD; a.pipelineUSD+=d.pipelineUSD; a.revenueUSD+=d.revenueUSD; } return map; }
function monthlyBars(series, metric, count){
  const map=monthlyMap(series), today=new Date(), ty=today.getFullYear(), tm=today.getMonth(), fmt=metricFmt(metric), bars=[];
  for(let i=count-1;i>=0;i--){ const d=new Date(ty,tm-i,1), y=d.getFullYear(), m=d.getMonth();
    const a=map.get(y+'-'+m)||EMPTY, p=map.get((y-1)+'-'+m);
    const value=metricValue(a,metric), prev=p?metricValue(p,metric):null;
    bars.push({ label:MON[m], value, prev, curLabel:`${MON[m]} ${y}`, prevLabel:`${MON[m]} ${y-1}`,
      delta:(prev&&prev>0)?(value-prev)/prev:null, partial:(y===ty&&m===tm) }); }
  return { bars, fmt };
}
function sumRange(series, s, e){ const a={...EMPTY}; for(let i=s;i<=e;i++){ const d=series[i];
  a.opps+=d.opps; a.wins+=d.wins; a.salesUSD+=d.salesUSD; a.pipelineUSD+=d.pipelineUSD; a.revenueUSD+=d.revenueUSD; } return a; }
function weeklyBars(series, metric, count){
  const N=series.length, last=N-1, fmt=metricFmt(metric), bars=[];
  for(let w=count-1;w>=0;w--){ const e=last-7*w, s=e-6; if(s<0) continue;
    const a=sumRange(series,s,e), pe=e-364, ps=pe-6, p=(ps>=0)?sumRange(series,ps,pe):null;
    const value=metricValue(a,metric), prev=p?metricValue(p,metric):null, ed=series[e].t;
    const lab=`${MON[ed.getMonth()]} ${ed.getDate()}`;
    bars.push({ label:lab, value, prev, curLabel:`Wk of ${lab}, ${ed.getFullYear()}`, prevLabel:`Wk of ${lab}, ${ed.getFullYear()-1}`,
      delta:(prev&&prev>0)?(value-prev)/prev:null, partial:(w===0) }); }
  return { bars, fmt };
}

/* ================= (5) bar chart ================= */
const SVGNS='http://www.w3.org/2000/svg';
const el=(t,a)=>{ const e=document.createElementNS(SVGNS,t); for(const k in a) e.setAttribute(k,a[k]); return e; };
function roundedTopRect(x,y,w,h,r){ r=Math.min(r,w/2,h); return `M${x} ${y+h} L${x} ${y+r} Q${x} ${y} ${x+r} ${y} L${x+w-r} ${y} Q${x+w} ${y} ${x+w} ${y+r} L${x+w} ${y+h} Z`; }
function barChart(container, bars, fmt, opt){
  opt=opt||{}; container.innerHTML='';
  const W=container.clientWidth||opt.w||300, H=opt.height||120;
  const ax=!!opt.showAxis, m=ax?{t:12,r:8,b:22,l:46}:{t:8,r:2,b:15,l:2};
  const iw=W-m.l-m.r, ih=H-m.t-m.b;
  const maxV=niceCeil(Math.max(1,...bars.map(b=>b.value), ...(opt.includePrev?bars.map(b=>b.prev||0):[])));
  const n=bars.length, slot=iw/n, bw=Math.min(opt.maxBar||64, slot*0.62);
  const x=i=>m.l+slot*i+slot/2, y=v=>m.t+ih-(v/maxV)*ih;
  const fill=opt.barFill||'var(--bar)', soft=opt.barSoft||'var(--bar-soft)', hi=opt.barHi||'var(--bar-hi)';
  const axcol=opt.axisColor||'var(--border)', txcol=opt.textColor||'var(--ink-3)';
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H}); svg.style.width='100%'; svg.style.height=H+'px';
  if(ax){ for(let g=0;g<=2;g++){ const val=maxV*g/2, yy=y(val);
    svg.appendChild(el('line',{x1:m.l,y1:yy,x2:W-m.r,y2:yy,stroke:axcol,'stroke-width':1}));
    const tx=el('text',{x:m.l-7,y:yy+3,'text-anchor':'end','font-size':10,fill:txcol,'font-weight':600}); tx.textContent=fmt(val); svg.appendChild(tx); } }
  svg.appendChild(el('line',{x1:m.l,y1:m.t+ih,x2:W-m.r,y2:m.t+ih,stroke:axcol,'stroke-width':1}));
  const tip=document.getElementById('tip');
  bars.forEach((b,i)=>{
    const by=y(b.value), bh=(m.t+ih)-by, bx=x(i)-bw/2;
    const base=b.partial?soft:fill;
    const rect=el('path',{d:roundedTopRect(bx,by,bw,Math.max(bh,1.5),Math.min(5,bw/2)),fill:base}); svg.appendChild(rect);
    if(opt.showLabels!==false){ const step=Math.max(1,Math.ceil(n/7)); if(i%step===0||i===n-1){ const tx=el('text',{x:x(i),y:H-5,'text-anchor':'middle','font-size':ax?10:9,fill:txcol,'font-weight':700}); tx.textContent=b.label; svg.appendChild(tx); } }
    const hit=el('rect',{x:x(i)-slot/2,y:m.t,width:slot,height:ih,fill:'transparent'});
    hit.addEventListener('mouseenter',()=>rect.setAttribute('fill',hi));
    hit.addEventListener('mousemove',ev=>{ tip.style.opacity=1; tip.style.left=(ev.clientX+12)+'px'; tip.style.top=(ev.clientY-44)+'px';
      let html=`${b.curLabel}: <b>${fmt(b.value)}</b>`;
      if(b.prev!=null){ const dp=b.delta, sign=dp>=0?'+':'', col=dp>=0?'#9af0c6':'#ffb8ae';
        html+=`<br>${b.prevLabel}: ${fmt(b.prev)}${dp!=null?` <span style="color:${col}">(${sign}${Math.round(dp*100)}%)</span>`:''}`; }
      tip.innerHTML=html; });
    hit.addEventListener('mouseleave',()=>{ rect.setAttribute('fill',base); tip.style.opacity=0; });
    svg.appendChild(hit);
  });
  container.appendChild(svg);
}

const KPIS = [
  { key:'salesUSD', label:'Sales', fmt:usdK },
  { key:'closedAvgSale', label:'Closed Avg', fmt:usd0 },
  { key:'oppJobAvg', label:'Opp Job Avg', fmt:usd0 },

];
let STATE = { range:'month', custom:{from:null,to:null}, lastUpdated:new Date() };
let CARD_CHARTS = [];
const rateClass = r => r>=0.38?'good':r>=0.30?'warn':'bad';
const healthColor = c => c==='good'?'var(--good)':c==='warn'?'var(--warn)':'var(--bad)';
function deltaHTML(d){ if(Math.abs(d)<0.001) return `<span class="d flat">— 0%</span>`;
  const cls=d>0?'up':'down', a=d>0?'▲':'▼'; return `<span class="d ${cls}">${a} ${Math.abs(d*100).toFixed(0)}%</span>`; }

function render(){
  const win = windowFor(STATE.range, STATE.custom);
  document.getElementById('periodLabel').textContent = win.labelFull;

  const rowsData = LOCATIONS.map(loc=>{ const series=Adapter.source.getDailySeries(loc);
    return { loc, cur:aggregate(series,win.from,win.to), prev:aggregate(series,win.prevFrom,win.prevTo), series }; });

  // company hero: totals + synthetic company series (for its 3-month bars)
  const N=rowsData[0].series.length;
  const compSeries = rowsData[0].series.map((d,i)=>({ t:d.t, opps:0,wins:0,salesUSD:0,pipelineUSD:0,revenueUSD:0 }));
  rowsData.forEach(r=>r.series.forEach((d,i)=>{ const c=compSeries[i]; c.opps+=d.opps; c.wins+=d.wins; c.salesUSD+=d.salesUSD; c.pipelineUSD+=d.pipelineUSD; c.revenueUSD+=d.revenueUSD; }));
  const tot=rowsData.reduce((a,r)=>{ a.salesUSD+=r.cur.salesUSD; a.revenueUSD+=r.cur.revenueUSD; a.opps+=r.cur.opps; a.wins+=r.cur.wins; a.pipeline+=r.cur.oppJobAvg*r.cur.opps; return a; },{salesUSD:0,revenueUSD:0,opps:0,wins:0,pipeline:0});
  const tp=rowsData.reduce((a,r)=>{ a.salesUSD+=r.prev.salesUSD; a.revenueUSD+=r.prev.revenueUSD; a.opps+=r.prev.opps; a.wins+=r.prev.wins; a.pipeline+=r.prev.oppJobAvg*r.prev.opps; return a; },{salesUSD:0,revenueUSD:0,opps:0,wins:0,pipeline:0});
  const cAgg=o=>({ salesUSD:o.salesUSD, revenueUSD:o.revenueUSD, opps:o.opps, wins:o.wins, closeRate:o.opps?o.wins/o.opps:0, closedAvgSale:o.wins?o.salesUSD/o.wins:0, oppJobAvg:o.opps?o.pipeline/o.opps:0 });

  const grid=document.getElementById('grid'); grid.innerHTML=''; CARD_CHARTS=[];
  const compBooking = LOCATIONS.reduce((s,l)=>s+bookingRate(l),0)/LOCATIONS.length;
  grid.appendChild(makeCard({ hero:true, name:'All Locations', region:`${LOCATIONS.length} franchises · company-wide`,
    cur:cAgg(tot), prev:cAgg(tp), series:compSeries, idx:-1, booking:compBooking }));
  rowsData.forEach((r,idx)=> grid.appendChild(makeCard({ hero:false, loc:r.loc, name:r.loc.name, region:r.loc.region, cur:r.cur, prev:r.prev, series:r.series, idx, booking:bookingRate(r.loc) })));

  // draw card bar charts now that cards are laid out
  CARD_CHARTS.forEach(drawCardChart);
  window.__rowsData = rowsData;
  STATE.lastUpdated = new Date(); updateAgo();
}

function makeCard(o){
  const card=document.createElement('div'); card.className='card'+(o.hero?' hero':'');
  const rc=rateClass(o.cur.closeRate);
  card.style.setProperty('--health', o.hero?'#fff':healthColor(rc));
  const d=delta(o.cur.revenueUSD, o.prev.revenueUSD);
  card.innerHTML = `
    <div class="c-head">
      <div class="badge">${logoInner()}</div>
      <div class="c-name"><b>${o.name}</b><span>${o.region}</span></div>
      <span class="health ${rc}"><span class="hd"></span>${pct(o.cur.closeRate)}</span>
    </div>
    <div class="c-primary"><span class="big num">${usdK(o.cur.revenueUSD)}</span><span class="plabel">Revenue · ${labelForRange()}</span>${deltaHTML(d)}</div>
    <div class="c-bars"><div class="bl"><span>Revenue — last 3 months</span><span>vs. prior year</span></div><div class="holder"></div></div>
    <div class="kpis">
      ${KPIS.map(k=>{ let cls='kv'; if(k.rate) cls+=' '+rateClass(o.cur.closeRate);
        return `<div class="kpi ${k.rate?'rate':''}"><div class="kl">${k.label}</div><div class="${cls} num">${k.fmt(o.cur[k.key])}</div></div>`; }).join('')}
    </div>
    <div class="c-rates">
      <div class="mr"><span class="ml">Booking</span><div class="track"><i style="width:${Math.round(o.booking*100)}%"></i></div><span class="mv num">${Math.round(o.booking*100)}%</span></div>
      <div class="mr"><span class="ml">Conversion</span><div class="track"><i style="width:${clampNum(o.cur.closeRate/0.6*100,4,100)}%"></i></div><span class="mv num">${pct(o.cur.closeRate)}</span></div>
    </div>`;
  card.addEventListener('click',()=>{ if(o.idx>=0) openDetail(o.idx); });
  if(o.idx<0) card.style.cursor='default';
  const holder=card.querySelector('.holder');
  const mb=monthlyBars(o.series,'revenue',3);
  CARD_CHARTS.push({ holder, bars:mb.bars, fmt:mb.fmt, hero:o.hero });
  return card;
}
function drawCardChart(c){
  const h=Math.max(46, Math.round((c.holder.clientHeight||0)) || 62);
  const opt={ height: c.holder.clientHeight>10?c.holder.clientHeight:64, maxBar:44 };
  if(c.hero){ opt.barFill='rgba(255,255,255,.9)'; opt.barSoft='rgba(255,255,255,.45)'; opt.barHi='#fff'; opt.axisColor='rgba(255,255,255,.25)'; opt.textColor='rgba(255,255,255,.72)'; }
  barChart(c.holder, c.bars, c.fmt, opt);
}
function labelForRange(){ return ({today:'today',week:'this wk',month:'this mo',quarter:'this qtr',year:'YTD',custom:'range'})[STATE.range]||''; }

/* ================= booking rate (seeded per location) ================= */
function bookingRate(loc){ return 0.58 + mulberry32(hashSeed(loc.name+'book'))()*0.3; }

/* ================= semicircle gauge ================= */
function gaugeChart(container, frac){
  frac=clampNum(frac,0,1);
  const W=230,H=138, cx=W/2, cy=118, R=90, tw=20;
  const pt=(f,rad)=>{ const a=Math.PI-(f*Math.PI); return [cx+rad*Math.cos(a), cy-rad*Math.sin(a)]; };
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H}); svg.style.width='100%'; svg.style.maxWidth=W+'px';
  const [sx,sy]=pt(0,R), [ex,ey]=pt(1,R);
  svg.appendChild(el('path',{d:`M ${sx} ${sy} A ${R} ${R} 0 0 1 ${ex} ${ey}`,fill:'none',stroke:'var(--bar-soft)','stroke-width':tw,'stroke-linecap':'round'}));
  if(frac>0.004){ const [vx,vy]=pt(frac,R); svg.appendChild(el('path',{d:`M ${sx} ${sy} A ${R} ${R} 0 0 1 ${vx} ${vy}`,fill:'none',stroke:'var(--brand-primary)','stroke-width':tw,'stroke-linecap':'round'})); }
  const [nx,ny]=pt(frac,R-4);
  svg.appendChild(el('line',{x1:cx,y1:cy,x2:nx,y2:ny,stroke:'var(--ink)','stroke-width':3,'stroke-linecap':'round'}));
  svg.appendChild(el('circle',{cx,cy,r:6,fill:'var(--ink)'}));
  const pc=el('text',{x:cx,y:cy-24,'text-anchor':'middle','font-size':22,'font-weight':800,fill:'var(--ink)'}); pc.textContent=Math.round(frac*100)+'%'; svg.appendChild(pc);
  container.innerHTML=''; container.appendChild(svg);
}

/* ================= location extras + technicians ================= */
function locExtras(loc, cur){
  const r=mulberry32(hashSeed(loc.name+'x'));
  const pipeline=cur.oppJobAvg*cur.opps;
  const nonJob=cur.salesUSD*(0.03+r()*0.05);
  return { totalSales:cur.salesUSD, closedAvg:cur.closedAvgSale, completed:cur.revenueUSD, oppJobAvg:cur.oppJobAvg,
    nonJob, adj:cur.revenueUSD+nonJob, missed:Math.max(0,pipeline-cur.salesUSD), booking:bookingRate(loc),
    conversion:cur.closeRate, csat:4.2+r()*0.7, cancellations:Math.round(cur.wins*(0.02+r()*0.05)), memberships:Math.round(cur.wins*(0.08+r()*0.16)) };
}
function last90Agg(loc){ const s=Adapter.source.getDailySeries(loc); const to=new Date(); to.setHours(23,59,59,999);
  const from=new Date(to.getTime()-89*DAY_MS); from.setHours(0,0,0,0); return aggregate(s,from,to); }
const TECH_POOL=['Joshua Rivera','Freddy Martinez','Victor Galeano','Marcus Cole','Dwayne Ellis','Sam Whitfield','Andre Boone','Ray Delacruz','Tyler Hoffman','Kenny Barnes','Cesar Ortiz','Brett Sullivan'];
function technicians(loc){
  const r=mulberry32(hashSeed(loc.name+'roster')); const agg=last90Agg(loc); const pipeline=agg.oppJobAvg*agg.opps;
  const K=clampNum(Math.round(2+loc.scale*2.4),2,5); const pool=[...TECH_POOL], names=[];
  for(let i=0;i<K-1;i++){ names.push(pool.splice(Math.floor(r()*pool.length),1)[0]); }
  names.push('Patchitup Technician');
  let ws=names.map(n=> n==='Patchitup Technician'? 0.05+r()*0.05 : Math.pow(0.5+r(),1.7));
  const sum=ws.reduce((a,b)=>a+b,0); ws=ws.map(w=>w/sum);
  return names.map((name,i)=>{ const w=ws[i], rr=mulberry32(hashSeed(loc.name+name));
    const opps=Math.max(1,Math.round(agg.opps*w*(0.82+rr()*0.5))), converted=clampNum(Math.round(agg.wins*w*(0.7+rr()*0.7)),0,opps);
    const revenue=agg.salesUSD*w*(0.85+rr()*0.35), oppJobAvg=(pipeline*w)/opps*(0.9+rr()*0.25), totalJobAvg=converted?revenue/converted:0, oppConv=opps?converted/opps:0;
    const csat=name==='Patchitup Technician'?null:(4.1+rr()*0.85), memSold=Math.round(converted*(0.08+rr()*0.18));
    return { name, initials:name.split(' ').map(x=>x[0]).slice(0,2).join(''), revenue, totalJobAvg, oppJobAvg, oppConv,
      opps, converted, csat, booking:0.5+rr()*0.4, conversion:oppConv, jobsPerDay:+(converted/64).toFixed(1),
      dur:+(1.4+rr()*2.4).toFixed(1), memSold, memRev:memSold*(220+Math.round(rr()*120)), renewals:Math.round(memSold*(0.4+rr()*0.4)) };
  }).sort((a,b)=>b.revenue-a.revenue);
}
function csatFace(score){ if(score==null) return '<span style="color:var(--ink-3);font-weight:700">N/A</span>';
  const col=score>=4.5?'var(--good)':score>=4.0?'var(--warn)':'var(--bad)';
  const mouth=score>=4.5?'M8.5 14.5 Q12 18 15.5 14.5':score>=4.0?'M8.5 15 Q12 16.5 15.5 15':'M8.5 16.5 Q12 14 15.5 16.5';
  return `<span class="csat" title="${score.toFixed(1)} / 5"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="2"><circle cx="12" cy="12" r="9.2"/><path d="M9 10.2h.01M15 10.2h.01" stroke-linecap="round"/><path d="${mouth}" stroke-linecap="round"/></svg></span>`; }

/* ================= detail drawer ================= */
let detailIdx=0, detailMetric='revenue', detailMode='month', techTab='overview', techView='table', TECH_CACHE=[];
function openDetail(idx){
  detailIdx=idx; const r=window.__rowsData[idx], loc=r.loc, win=windowFor(STATE.range,STATE.custom), ex=locExtras(loc,r.cur);
  document.getElementById('dBadge').innerHTML=logoInner();
  document.getElementById('dName').textContent=loc.name;
  document.getElementById('dId').textContent=`${loc.region} · ServiceTitan tenant ${loc.tenant}`;
  const frac=(ex.completed+ex.missed)>0 ? ex.completed/(ex.completed+ex.missed) : 0;
  gaugeChart(document.getElementById('dGauge'), frac);
  document.getElementById('dGaugeRev').textContent=usdK(ex.completed);
  document.getElementById('dGaugeMissed').textContent=usdK(ex.missed);
  const per=win.label.toLowerCase();
  document.getElementById('dGaugeTitle').textContent='Revenue · '+per;
  document.getElementById('dMetricsPeriod').textContent=per;
  const m6=[['Total Sales',usdK(ex.totalSales)],['Closed Avg Sale',usd0(ex.closedAvg)],['Completed Revenue',usdK(ex.completed)],
    ['Opportunity Job Avg',usd0(ex.oppJobAvg)],['Non-Job Revenue',usdK(ex.nonJob)],['Adj. Revenue',usdK(ex.adj)]];
  document.getElementById('dMetrics').innerHTML=m6.map(([k,v])=>`<div class="dtile"><div class="kl">${k}</div><div class="kv num">${v}</div></div>`).join('');
  document.getElementById('dRates').innerHTML=
    `<div class="bb"><div class="top"><span>Call Booking Rate</span><span class="val num">${Math.round(ex.booking*100)}%</span></div><div class="track"><i style="width:${Math.round(ex.booking*100)}%"></i></div></div>`+
    `<div class="bb"><div class="top"><span>Total Conversion Rate</span><span class="val num">${pct(ex.conversion)}</span></div><div class="track"><i style="width:${clampNum(ex.conversion*140,3,100)}%"></i></div></div>`;
  document.getElementById('dMini').innerHTML=
    `<div class="ms"><div class="k">Customer<br>Satisfaction</div><div class="v num">${ex.csat.toFixed(1)}</div></div>`+
    `<div class="ms"><div class="k">Total<br>Cancellations</div><div class="v num">${ex.cancellations}</div></div>`+
    `<div class="ms"><div class="k">Memberships<br>Converted</div><div class="v num">${ex.memberships}</div></div>`;
  TECH_CACHE=technicians(loc); renderTech(); drawDetailChart();
  const dlg=document.getElementById('detail'); if(!dlg.open) dlg.showModal(); dlg.querySelector('.db').scrollTop=0;
}
function drawDetailChart(){
  const r=window.__rowsData[detailIdx];
  const res = detailMode==='month' ? monthlyBars(r.series,detailMetric,18) : weeklyBars(r.series,detailMetric,18);
  document.getElementById('dChartTitle').textContent=(detailMode==='month'?'18 Month':'18 Week')+' Trend';
  barChart(document.getElementById('dChart'), res.bars, res.fmt, { showAxis:true, height:200, maxBar:26 });
}
const TAB_COLS={
  overview:[{h:'Revenue',get:t=>usdK(t.revenue)},{h:'Total Job Avg',get:t=>usd0(t.totalJobAvg)},{h:'Opp. Job Avg',get:t=>usd0(t.oppJobAvg)},{h:'Opp. Conversion Rate',bar:t=>t.oppConv,get:t=>pct(t.oppConv)},{h:'# Opps',get:t=>int(t.opps)},{h:'Converted Jobs',get:t=>int(t.converted)},{h:'Customer Satisfaction',csat:t=>t.csat}],
  lead:[{h:'# Opps',get:t=>int(t.opps)},{h:'Booking Rate',bar:t=>t.booking,get:t=>Math.round(t.booking*100)+'%'},{h:'Converted Jobs',get:t=>int(t.converted)},{h:'Conversion Rate',bar:t=>t.conversion,get:t=>pct(t.conversion)},{h:'Customer Satisfaction',csat:t=>t.csat}],
  memberships:[{h:'Memberships Sold',get:t=>int(t.memSold)},{h:'Membership Rev.',get:t=>usdK(t.memRev)},{h:'Renewals',get:t=>int(t.renewals)},{h:'Converted Jobs',get:t=>int(t.converted)},{h:'Customer Satisfaction',csat:t=>t.csat}],
  productivity:[{h:'# Opps',get:t=>int(t.opps)},{h:'Converted Jobs',get:t=>int(t.converted)},{h:'Jobs / Day',get:t=>t.jobsPerDay.toFixed(1)},{h:'Avg Job Hrs',get:t=>t.dur.toFixed(1)},{h:'Customer Satisfaction',csat:t=>t.csat}],
  sales:[{h:'Revenue',get:t=>usdK(t.revenue)},{h:'Total Job Avg',get:t=>usd0(t.totalJobAvg)},{h:'Opp. Job Avg',get:t=>usd0(t.oppJobAvg)},{h:'# Opps',get:t=>int(t.opps)},{h:'Converted Jobs',get:t=>int(t.converted)}],
};
function techTotals(ts){ const s={rev:0,opps:0,conv:0,memSold:0,memRev:0,ren:0,pipe:0}; let cs=0,cn=0,bk=0,du=0,jpd=0;
  ts.forEach(t=>{ s.rev+=t.revenue; s.opps+=t.opps; s.conv+=t.converted; s.memSold+=t.memSold; s.memRev+=t.memRev; s.ren+=t.renewals; s.pipe+=t.oppJobAvg*t.opps; if(t.csat!=null){cs+=t.csat;cn++;} bk+=t.booking; du+=t.dur; jpd+=t.jobsPerDay; });
  const n=ts.length||1; return { name:'Totals and Averages', initials:'', revenue:s.rev, totalJobAvg:s.conv?s.rev/s.conv:0, oppJobAvg:s.opps?s.pipe/s.opps:0, oppConv:s.opps?s.conv/s.opps:0, opps:s.opps, converted:s.conv, csat:cn?cs/cn:null, booking:bk/n, conversion:s.opps?s.conv/s.opps:0, jobsPerDay:jpd, dur:du/n, memSold:s.memSold, memRev:s.memRev, renewals:s.ren }; }
function cellHTML(t,c){ if(c.csat) return `<td>${csatFace(c.csat(t))}</td>`;
  if(c.bar) return `<td><div class="tbar"><div class="track"><i style="width:${clampNum(c.bar(t)*140,3,100)}%"></i></div><span>${c.get(t)}</span></div></td>`;
  return `<td>${c.get(t)}</td>`; }
function renderTech(){
  const host=document.getElementById('dTech');
  if(techView==='chart'){ host.innerHTML='<div class="panel" id="techChartHost"></div>';
    const bars=TECH_CACHE.map(t=>({label:t.name.split(' ')[0], value:t.revenue, prev:null, curLabel:t.name, delta:null}));
    barChart(document.getElementById('techChartHost'), bars, usdK, {showAxis:true, height:260, maxBar:64}); return; }
  const cols=TAB_COLS[techTab], tot=techTotals(TECH_CACHE);
  let html=`<div class="tblwrap"><table class="tech-table"><thead><tr><th class="l">Name</th>${cols.map(c=>`<th>${c.h}</th>`).join('')}</tr></thead><tbody>`;
  TECH_CACHE.forEach(t=>{ html+=`<tr><td class="l"><div class="tech-name"><div class="tech-ava">${t.initials}</div>${t.name}</div></td>${cols.map(c=>cellHTML(t,c)).join('')}</tr>`; });
  html+=`</tbody><tfoot><tr><td class="l">Totals and Averages</td>${cols.map(c=>cellHTML(tot,c)).join('')}</tr></tfoot></table></div>`;
  host.innerHTML=html;
}
document.getElementById('dMetric').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return;
  detailMetric=b.dataset.m; document.querySelectorAll('#dMetric button').forEach(x=>x.setAttribute('aria-pressed',x===b)); drawDetailChart(); });
document.getElementById('dMode').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return;
  detailMode=b.dataset.mode; document.querySelectorAll('#dMode button').forEach(x=>x.setAttribute('aria-pressed',x===b)); drawDetailChart(); });
document.getElementById('dTabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return;
  techTab=b.dataset.tab; document.querySelectorAll('#dTabs button').forEach(x=>x.setAttribute('aria-pressed',x===b)); renderTech(); });
document.getElementById('dTechView').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return;
  techView=b.dataset.tv; document.querySelectorAll('#dTechView button').forEach(x=>x.setAttribute('aria-pressed',x===b)); renderTech(); });
document.getElementById('dClose').addEventListener('click',()=>document.getElementById('detail').close());

/* ================= controls ================= */
document.querySelector('.seg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return;
  STATE.range=b.dataset.range; document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  document.getElementById('customBox').classList.toggle('on', STATE.range==='custom');
  if(STATE.range==='custom' && !STATE.custom.from){ const iso=d=>d.toISOString().slice(0,10);
    STATE.custom={from:iso(new Date(Date.now()-29*DAY_MS)),to:iso(new Date())};
    document.getElementById('cFrom').value=STATE.custom.from; document.getElementById('cTo').value=STATE.custom.to; }
  render(); });
document.getElementById('cFrom').addEventListener('change',e=>{ STATE.custom.from=e.target.value; if(STATE.range==='custom') render(); });
document.getElementById('cTo').addEventListener('change',e=>{ STATE.custom.to=e.target.value; if(STATE.range==='custom') render(); });
document.getElementById('themeBtn').addEventListener('click',()=>{ const root=document.documentElement;
  const cur=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  root.setAttribute('data-theme',cur==='dark'?'light':'dark'); render(); if(document.getElementById('detail').open) drawDetailChart(); });

/* ================= clock + hourly refresh ================= */
function tickClock(){ const now=new Date();
  document.getElementById('clock').textContent=now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  document.getElementById('date').textContent=now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }
function updateAgo(){ const s=Math.floor((Date.now()-STATE.lastUpdated.getTime())/1000);
  document.getElementById('updatedAgo').textContent=s<60?'just now':s<3600?`${Math.floor(s/60)} min ago`:`${Math.floor(s/3600)} hr ago`; }
const REFRESH_MS=60*60*1000; let nextRefresh=Date.now()+REFRESH_MS;
function tickCountdown(){ let ms=nextRefresh-Date.now(); if(ms<=0){ doRefresh(); ms=REFRESH_MS; }
  const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000);
  document.getElementById('countdown').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
function doRefresh(){ nextRefresh=Date.now()+REFRESH_MS; const b=document.getElementById('refreshBtn');
  b.classList.add('spin'); setTimeout(()=>b.classList.remove('spin'),800); Adapter.refresh().then(render); }
document.getElementById('refreshBtn').addEventListener('click',doRefresh);

/* ================= (7) Adapter — only data seam =================
   Today: MockSource. Live: source.getDailySeries(loc) → fetch your backend
   (which holds the ServiceTitan cid./cs1. secrets and pulls hourly). See README. */
const Adapter = { source: MockSource, async refresh(){ return true; } };

/* ================= boot ================= */
setHeaderLogo(); tickClock(); render();
setInterval(tickClock,1000); setInterval(updateAgo,15000); setInterval(tickCountdown,1000);
let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ CARD_CHARTS.forEach(drawCardChart); if(document.getElementById('detail').open) drawDetailChart(); },150); });
</script>
