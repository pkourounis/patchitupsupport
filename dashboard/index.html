<!--
  PatchitUP Corporate Dashboard — widget/block layout
  Single-screen (16:9). Each location is its own card. Auto-refreshes hourly.

  DATA: renders realistic SAMPLE data through the `Adapter` seam (bottom of <script>).
  Data source is ServiceTitan (per-tenant Tenant ID + Client ID/Secret). Secrets live
  on a backend, never in this page. See dashboard/README.md.

  BRAND: all brand colors are the --brand-* tokens in :root (and the dark block).
  These are PLACEHOLDER PatchitUP navy+orange values — swap for the exact brand hex
  once confirmed and the whole board reskins. Per-location logos: set `logoUrl` on a
  location (see LOCATIONS) to replace its monogram badge with a real image.
-->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PatchitUP · Corporate Dashboard</title>
<style>
  /* ============================ BRAND TOKENS ============================
     Swap these six for the exact PatchitUP hex values. Everything derives
     from them. (Placeholder: navy + orange.) */
  :root {
    --brand-primary:      #14608f;   /* PatchitUP blue */
    --brand-primary-deep: #0b2c49;   /* deep navy */
    --brand-accent:       #f47b20;   /* action orange */
    --brand-accent-deep:  #d8611a;
    --brand-accent-wash:  #fdefe2;
    --brand-on-primary:   #ffffff;   /* text on navy/blue */
  }
  /* ==================================================================== */

  :root {
    color-scheme: light dark;
    /* neutrals — cool slate, biased slightly toward brand blue */
    --bg:#e9edf1; --panel:#ffffff; --panel-2:#f5f7fa;
    --ink:#16202b; --ink-2:#556170; --ink-3:#8792a1;
    --border:#e0e5eb; --border-2:#edf0f4;
    /* reserved semantic (health + deltas only) */
    --good:#1f9d63; --good-wash:#e7f5ee; --bad:#d5493d; --bad-wash:#fbeae8; --warn:#c98a12;
    /* accent alias used by charts/active states */
    --accent: var(--brand-accent);
    --accent-wash: var(--brand-accent-wash);
    --shadow: 0 1px 2px rgba(16,32,43,.05), 0 10px 26px rgba(16,32,43,.07);
    --radius: 16px; --radius-sm: 10px;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --brand-primary:#3f95d8; --brand-primary-deep:#0b2c49; --brand-accent:#ff934d;
      --brand-accent-deep:#f47b20; --brand-accent-wash:#2a1a0e; --brand-on-primary:#ffffff;
      --bg:#0b0e13; --panel:#151a21; --panel-2:#1a2028;
      --ink:#e8ecf1; --ink-2:#98a2b1; --ink-3:#606a79;
      --border:#252c36; --border-2:#1f252e;
      --good:#35bd80; --good-wash:#12261d; --bad:#f0655a; --bad-wash:#2a1512; --warn:#e6a53a;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px rgba(0,0,0,.38);
    }
  }
  :root[data-theme="light"] {
    --brand-primary:#14608f; --brand-primary-deep:#0b2c49; --brand-accent:#f47b20; --brand-accent-deep:#d8611a; --brand-accent-wash:#fdefe2; --brand-on-primary:#fff;
    --bg:#e9edf1; --panel:#fff; --panel-2:#f5f7fa; --ink:#16202b; --ink-2:#556170; --ink-3:#8792a1;
    --border:#e0e5eb; --border-2:#edf0f4; --good:#1f9d63; --good-wash:#e7f5ee; --bad:#d5493d; --bad-wash:#fbeae8; --warn:#c98a12;
    --shadow:0 1px 2px rgba(16,32,43,.05),0 10px 26px rgba(16,32,43,.07);
  }
  :root[data-theme="dark"] {
    --brand-primary:#3f95d8; --brand-primary-deep:#0b2c49; --brand-accent:#ff934d; --brand-accent-deep:#f47b20; --brand-accent-wash:#2a1a0e; --brand-on-primary:#fff;
    --bg:#0b0e13; --panel:#151a21; --panel-2:#1a2028; --ink:#e8ecf1; --ink-2:#98a2b1; --ink-3:#606a79;
    --border:#252c36; --border-2:#1f252e; --good:#35bd80; --good-wash:#12261d; --bad:#f0655a; --bad-wash:#2a1512; --warn:#e6a53a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.38);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font);
    -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; }
  .num { font-variant-numeric: tabular-nums; letter-spacing:-.01em; }

  .app { height:100vh; display:grid; grid-template-rows:auto 1fr; gap:clamp(9px,1.1vh,16px);
    padding:clamp(10px,1.3vw,20px); }

  /* ---------- Top bar ---------- */
  .bar { display:flex; align-items:center; gap:clamp(10px,1.3vw,20px); flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:11px; min-width:0; }
  .logo { width:clamp(32px,2.6vw,44px); aspect-ratio:1; border-radius:11px; flex:none;
    background:linear-gradient(140deg,var(--brand-primary),var(--brand-primary-deep));
    display:grid; place-items:center; color:var(--brand-on-primary); font-weight:800;
    font-size:clamp(16px,1.4vw,22px); box-shadow:var(--shadow); position:relative; overflow:hidden; }
  .logo::after { content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 3px,transparent 3px 8px); mix-blend-mode:overlay; }
  .title { display:flex; flex-direction:column; line-height:1.06; min-width:0; }
  .title b { font-size:clamp(15px,1.4vw,22px); font-weight:750; letter-spacing:-.015em; }
  .title b span { color:var(--brand-accent); }
  .title small { font-size:clamp(10px,.8vw,12px); color:var(--ink-3); letter-spacing:.04em; text-transform:uppercase; }
  .spacer { flex:1 1 auto; }

  .seg { display:inline-flex; background:var(--panel); border:1px solid var(--border);
    border-radius:11px; padding:3px; gap:2px; box-shadow:var(--shadow); }
  .seg button { border:0; background:transparent; color:var(--ink-2); cursor:pointer; font:inherit;
    font-weight:600; font-size:clamp(11px,.82vw,13px); padding:clamp(5px,.7vh,8px) clamp(9px,.9vw,15px);
    border-radius:8px; white-space:nowrap; transition:background .15s,color .15s; }
  .seg button:hover { color:var(--ink); }
  .seg button[aria-pressed="true"] { background:var(--brand-accent); color:#fff; }
  .custom { display:none; align-items:center; gap:6px; }
  .custom.on { display:inline-flex; }
  .custom input { font:inherit; font-size:clamp(11px,.8vw,13px); color:var(--ink); background:var(--panel);
    border:1px solid var(--border); border-radius:8px; padding:5px 8px; }
  .custom span { color:var(--ink-3); font-size:12px; }

  .status { display:flex; align-items:center; gap:clamp(9px,1vw,15px); flex-wrap:wrap; }
  .refresh { display:inline-flex; align-items:center; gap:8px; background:var(--panel);
    border:1px solid var(--border); border-radius:10px; padding:6px 11px; box-shadow:var(--shadow); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--good); }
  .dot.live { animation:pulse 2.4s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent);} 70%{box-shadow:0 0 0 7px transparent;} 100%{box-shadow:0 0 0 0 transparent;} }
  .refresh small { color:var(--ink-3); font-size:clamp(9.5px,.72vw,11px); display:block; letter-spacing:.02em; }
  .refresh b { font-size:clamp(11px,.85vw,13px); }
  .iconbtn { border:1px solid var(--border); background:var(--panel); color:var(--ink-2); cursor:pointer;
    width:clamp(30px,2.3vw,38px); aspect-ratio:1; border-radius:10px; display:grid; place-items:center;
    box-shadow:var(--shadow); transition:color .15s; }
  .iconbtn:hover { color:var(--ink); }
  .iconbtn svg { width:55%; height:55%; }
  .iconbtn.spin svg { animation:spin .8s ease; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .clock { text-align:right; line-height:1.1; }
  .clock b { font-size:clamp(14px,1.15vw,18px); font-weight:700; }
  .clock span { display:block; font-size:clamp(9.5px,.72vw,11px); color:var(--ink-3); letter-spacing:.03em; }

  /* ---------- Card grid ---------- */
  .grid { display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:1fr;
    gap:clamp(9px,1vw,16px); min-height:0; }

  .card { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:clamp(11px,1.1vw,18px); display:flex; flex-direction:column;
    gap:clamp(6px,.8vh,12px); min-width:0; min-height:0; position:relative; overflow:hidden;
    transition:transform .12s, box-shadow .12s, border-color .12s; cursor:pointer; }
  .card:hover { transform:translateY(-2px); border-color:color-mix(in srgb,var(--brand-accent) 40%,var(--border));
    box-shadow:0 2px 4px rgba(16,32,43,.06),0 16px 40px rgba(16,32,43,.12); }
  .card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:var(--health,var(--brand-accent)); opacity:.9; }

  .c-head { display:flex; align-items:center; gap:10px; min-width:0; }
  .badge { width:clamp(30px,2.5vw,42px); aspect-ratio:1; border-radius:10px; flex:none; overflow:hidden;
    background:linear-gradient(140deg,var(--brand-primary),var(--brand-primary-deep));
    color:var(--brand-on-primary); display:grid; place-items:center; font-weight:750;
    font-size:clamp(11px,1vw,15px); letter-spacing:.01em; }
  .badge img { width:100%; height:100%; object-fit:cover; }
  .c-name { min-width:0; display:flex; flex-direction:column; line-height:1.12; }
  .c-name b { font-size:clamp(13px,1.15vw,18px); font-weight:720; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .c-name span { font-size:clamp(9.5px,.72vw,11.5px); color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .health { margin-left:auto; flex:none; display:inline-flex; align-items:center; gap:5px;
    font-size:clamp(10px,.8vw,12.5px); font-weight:750; padding:3px 9px; border-radius:20px; }
  .health .hd { width:7px; height:7px; border-radius:50%; background:currentColor; }
  .health.good { color:var(--good); background:var(--good-wash); }
  .health.warn { color:var(--warn); background:color-mix(in srgb,var(--warn) 14%,transparent); }
  .health.bad  { color:var(--bad); background:var(--bad-wash); }

  .c-primary { display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }
  .c-primary .big { font-size:clamp(26px,3vw,46px); font-weight:780; letter-spacing:-.025em; line-height:1; }
  .c-primary .plabel { font-size:clamp(9.5px,.72vw,11.5px); color:var(--ink-3); text-transform:uppercase; letter-spacing:.05em; font-weight:650; }
  .d { font-size:clamp(10px,.82vw,13px); font-weight:700; display:inline-flex; align-items:center; gap:3px; }
  .up{color:var(--good);} .down{color:var(--bad);} .flat{color:var(--ink-3);}

  .kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(4px,.5vw,9px) clamp(6px,.7vw,12px); margin-top:auto; }
  .kpi { min-width:0; }
  .kpi .kl { font-size:clamp(8.5px,.66vw,10.5px); color:var(--ink-3); text-transform:uppercase; letter-spacing:.04em; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .kpi .kv { font-size:clamp(12px,1.05vw,17px); font-weight:680; letter-spacing:-.01em; }
  .kpi.rate .kv.good{color:var(--good);} .kpi.rate .kv.warn{color:var(--warn);} .kpi.rate .kv.bad{color:var(--bad);}

  .c-spark { border-top:1px solid var(--border-2); padding-top:clamp(4px,.6vh,8px); }
  .c-spark .sl { display:flex; justify-content:space-between; font-size:clamp(8.5px,.64vw,10px); color:var(--ink-3); letter-spacing:.03em; margin-bottom:3px; }
  .c-spark svg { display:block; width:100%; }

  /* ---------- Company hero card ---------- */
  .card.hero { background:linear-gradient(150deg,var(--brand-primary),var(--brand-primary-deep));
    color:var(--brand-on-primary); border-color:transparent; }
  .card.hero::before { background:var(--brand-accent); opacity:1; }
  .card.hero .c-name b { color:#fff; }
  .card.hero .c-name span, .card.hero .c-primary .plabel, .card.hero .kpi .kl, .card.hero .c-spark .sl { color:rgba(255,255,255,.7); }
  .card.hero .kpi .kv { color:#fff; }
  .card.hero .badge { background:rgba(255,255,255,.16); }
  .card.hero .c-spark { border-top-color:rgba(255,255,255,.18); }
  .card.hero .health { background:rgba(255,255,255,.16); color:#fff; }
  .card.hero .d.up { color:#8ff0c0; } .card.hero .d.down { color:#ffb3ab; }

  /* ---------- Detail drawer ---------- */
  dialog#detail { border:1px solid var(--border); background:var(--panel); color:var(--ink);
    border-radius:16px; padding:0; box-shadow:0 30px 80px rgba(0,0,0,.45); width:min(880px,92vw); max-height:88vh; }
  dialog#detail::backdrop { background:rgba(6,9,14,.55); backdrop-filter:blur(2px); }
  .dh { display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--border); }
  .dh .badge { width:38px; }
  .dh b { font-size:18px; font-weight:750; } .dh span { color:var(--ink-3); font-size:12px; display:block; }
  .db { padding:18px 20px; display:flex; flex-direction:column; gap:15px; }
  .dgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
  .dtile { background:var(--panel-2); border:1px solid var(--border); border-radius:11px; padding:10px 12px; }
  .dtile .kl { font-size:10px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.04em; font-weight:600; }
  .dtile .kv { font-size:19px; font-weight:740; letter-spacing:-.02em; }
  .chart-wrap { border:1px solid var(--border); border-radius:12px; padding:14px 14px 6px; background:var(--panel-2); }
  .chart-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; flex-wrap:wrap; gap:8px; }
  .chart-head b { font-size:13px; }
  .metricsel { display:inline-flex; gap:2px; background:var(--panel); border:1px solid var(--border); border-radius:9px; padding:2px; flex-wrap:wrap; }
  .metricsel button { border:0; background:transparent; color:var(--ink-2); font:inherit; font-weight:600; font-size:11px; padding:4px 9px; border-radius:7px; cursor:pointer; }
  .metricsel button[aria-pressed="true"] { background:var(--brand-accent); color:#fff; }
  .closeb { margin-left:auto; border:1px solid var(--border); background:var(--panel); color:var(--ink-2); border-radius:9px; width:32px; height:32px; cursor:pointer; font-size:16px; }
  .tip { position:fixed; pointer-events:none; z-index:50; background:var(--ink); color:var(--bg);
    padding:6px 9px; border-radius:8px; font-size:11px; font-weight:600; opacity:0; transition:opacity .1s; white-space:nowrap; box-shadow:0 6px 20px rgba(0,0,0,.3); }

  /* footer legend */
  .foot { position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; gap:14px;
    padding:5px; font-size:10.5px; color:var(--ink-3); pointer-events:none; }
  .foot .lg { display:inline-flex; align-items:center; gap:5px; }
  .foot .sw { width:9px; height:9px; border-radius:3px; }

  /* responsive */
  @media (max-width:1200px), (max-aspect-ratio:12/9) {
    .app { height:auto; min-height:100vh; }
    .grid { grid-template-columns:repeat(3,1fr); }
    .foot { position:static; margin-top:8px; }
  }
  @media (max-width:820px) { .grid { grid-template-columns:repeat(2,1fr); } .dgrid { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:520px) { .grid { grid-template-columns:1fr; } }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>

<script>
/* ================= (1) format helpers ================= */
const usd0 = n => n>=1000 ? '$'+Math.round(n).toLocaleString('en-US') : '$'+Math.round(n);
const usdK = n => { if(n>=1e6)return '$'+(n/1e6).toFixed(n>=1e7?1:2)+'M'; if(n>=1e4)return '$'+(n/1e3).toFixed(0)+'K'; if(n>=1000)return '$'+(n/1e3).toFixed(1)+'K'; return '$'+Math.round(n); };
const pct = n => (n*100).toFixed(1)+'%';
const int = n => Math.round(n).toLocaleString('en-US');
const clampNum = (v,a,b) => Math.max(a, Math.min(b, v));
function hashSeed(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=(h<<13)|(h>>>19);} return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

/* ================= (2) locations + SAMPLE data source =================
   Each location has a `code` (monogram) and `logoUrl` (null → monogram badge;
   set a URL to render a real per-location logo). ServiceTitan tenantId lives
   here as an id placeholder; the SECRET (cs1.) never appears client-side. */
const LOCATIONS = [
  { name:'Nassau County',  code:'NC', region:'Long Island, NY', tenant:'2326750229', logoUrl:null, scale:1.42, close:0.40, avgOpp:2650 },
  { name:'Suffolk County', code:'SC', region:'Long Island, NY', tenant:'2326750249', logoUrl:null, scale:1.34, close:0.37, avgOpp:2520 },
  { name:'North Dallas',   code:'ND', region:'Dallas, TX',      tenant:'4990769685', logoUrl:null, scale:1.24, close:0.35, avgOpp:2980 },
  { name:'West Houston',   code:'WH', region:'Houston, TX',     tenant:'4304652207', logoUrl:null, scale:1.08, close:0.33, avgOpp:2740 },
  { name:'Charlotte',      code:'CH', region:'Charlotte, NC',   tenant:'4753625109', logoUrl:null, scale:0.92, close:0.31, avgOpp:2380 },
  { name:'Lansdale',       code:'LN', region:'Lansdale, PA',    tenant:'3327763989', logoUrl:null, scale:0.78, close:0.36, avgOpp:2210 },
  { name:'Saginaw',        code:'SG', region:'Saginaw, MI',     tenant:'4095872533', logoUrl:null, scale:0.58, close:0.29, avgOpp:1980 },
];

const DAYS = 760, DAY_MS = 86400000;
const MockSource = (() => {
  const cache = new Map();
  function build(loc){
    const rnd = mulberry32(hashSeed(loc.name));
    const today = new Date(); today.setHours(0,0,0,0);
    const out = [];
    for (let i=DAYS-1; i>=0; i--){
      const t = new Date(today.getTime()-i*DAY_MS);
      const dow = t.getDay();
      const weekend = dow===0?0.35:dow===6?0.6:1;
      const seasonal = 1 + 0.16*Math.sin((t.getMonth()+1)/12*2*Math.PI - 1.1);
      const trend = 1 + 0.18*((DAYS-1-i)/DAYS);
      const noise = 0.72 + rnd()*0.56;
      const opps = Math.max(0, Math.round(6.2*loc.scale*weekend*seasonal*trend*noise));
      const avgOpp = loc.avgOpp*(0.9+rnd()*0.24)*seasonal;
      const pipelineUSD = opps*avgOpp;
      const closeR = clampNum(loc.close*(0.82+rnd()*0.4), 0.12, 0.62);
      const wins = clampNum(Math.round(opps*closeR), 0, opps);
      const avgWon = avgOpp*(1.04+rnd()*0.22);
      const salesUSD = wins*avgWon;
      const revenueUSD = salesUSD*(0.86+rnd()*0.09);
      out.push({ t, opps, wins, salesUSD, pipelineUSD, revenueUSD });
    }
    return out;
  }
  return { getDailySeries(loc){ if(!cache.has(loc.name)) cache.set(loc.name, build(loc)); return cache.get(loc.name); } };
})();

/* ================= (3) date windows ================= */
function windowFor(range, custom){
  const now = new Date(); now.setHours(23,59,59,999);
  const start = new Date(now); start.setHours(0,0,0,0);
  let from = new Date(start), to = new Date(now), label='';
  const day = start.getDay();
  switch(range){
    case 'today': label='Today'; break;
    case 'week': { const back=(day===0?6:day-1); from=new Date(start.getTime()-back*DAY_MS); label='This week'; break; }
    case 'month': from=new Date(start.getFullYear(),start.getMonth(),1); label='This month'; break;
    case 'quarter': { const q=Math.floor(start.getMonth()/3)*3; from=new Date(start.getFullYear(),q,1); label='This quarter'; break; }
    case 'year': from=new Date(start.getFullYear(),0,1); label='This year'; break;
    case 'custom': from=new Date(custom.from+'T00:00:00'); to=new Date(custom.to+'T23:59:59'); label='Custom'; break;
  }
  const span=to-from, prevTo=new Date(from.getTime()-1), prevFrom=new Date(from.getTime()-1-span);
  const fmt=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  const labelFull = range==='today' ? `${label} · ${fmt(from)}` : `${label} · ${fmt(from)} – ${fmt(to)}`;
  return { from, to, prevFrom, prevTo, label, labelFull };
}

/* ================= (4) aggregation ================= */
function aggregate(series, from, to){
  let opps=0,wins=0,salesUSD=0,pipelineUSD=0,revenueUSD=0;
  for (const d of series){ if(d.t>=from&&d.t<=to){ opps+=d.opps; wins+=d.wins; salesUSD+=d.salesUSD; pipelineUSD+=d.pipelineUSD; revenueUSD+=d.revenueUSD; } }
  return { opps, wins, salesUSD, revenueUSD, closeRate:opps?wins/opps:0, closedAvgSale:wins?salesUSD/wins:0, oppJobAvg:opps?pipelineUSD/opps:0 };
}
const delta = (cur,prev) => prev>0 ? (cur-prev)/prev : (cur>0?1:0);

/* ================= (5) charts ================= */
const SVGNS='http://www.w3.org/2000/svg';
const el=(t,a)=>{ const e=document.createElementNS(SVGNS,t); for(const k in a) e.setAttribute(k,a[k]); return e; };
function sparkline(values, w, h, color){
  const svg=el('svg',{viewBox:`0 0 ${w} ${h}`,preserveAspectRatio:'none',height:h});
  svg.style.height=h+'px';
  const min=Math.min(...values), max=Math.max(...values), rng=(max-min)||1, pad=2, iw=w-pad*2, ih=h-pad*2-1;
  const x=i=>pad+(i/(values.length-1))*iw, y=v=>pad+ih-((v-min)/rng)*ih;
  const up=values[values.length-1]>=values[0];
  const col=color||(up?'var(--good)':'var(--brand-accent)');
  let dLine=''; values.forEach((v,i)=>{ dLine+=(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '; });
  const gid='g'+Math.random().toString(36).slice(2,8);
  const defs=el('defs',{}), lg=el('linearGradient',{id:gid,x1:0,y1:0,x2:0,y2:1});
  lg.appendChild(el('stop',{offset:'0%','stop-color':col,'stop-opacity':'0.28'}));
  lg.appendChild(el('stop',{offset:'100%','stop-color':col,'stop-opacity':'0'}));
  defs.appendChild(lg); svg.appendChild(defs);
  svg.appendChild(el('path',{d:dLine+`L ${x(values.length-1).toFixed(1)} ${h-pad} L ${x(0).toFixed(1)} ${h-pad} Z`,fill:`url(#${gid})`}));
  svg.appendChild(el('path',{d:dLine,fill:'none',stroke:col,'stroke-width':'1.7','stroke-linejoin':'round','stroke-linecap':'round'}));
  svg.appendChild(el('circle',{cx:x(values.length-1).toFixed(1),cy:y(values[values.length-1]).toFixed(1),r:'2.4',fill:col}));
  return svg;
}
function lineChart(container, days, values, fmtVal){
  container.innerHTML='';
  const W=container.clientWidth||780, H=230, m={t:14,r:14,b:22,l:54}, iw=W-m.l-m.r, ih=H-m.t-m.b;
  const min=Math.min(...values), max=Math.max(...values), rng=(max-min)||1;
  const svg=el('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`});
  const x=i=>m.l+(i/(values.length-1))*iw, y=v=>m.t+ih-((v-min)/rng)*ih;
  for(let g=0;g<=4;g++){ const val=min+rng*g/4, yy=y(val);
    svg.appendChild(el('line',{x1:m.l,y1:yy,x2:W-m.r,y2:yy,stroke:'var(--border)','stroke-width':1}));
    const tx=el('text',{x:m.l-8,y:yy+3,'text-anchor':'end','font-size':10,fill:'var(--ink-3)'}); tx.textContent=fmtVal(val); svg.appendChild(tx); }
  days.forEach((d,i)=>{ if(i%15===0||i===days.length-1){ const tx=el('text',{x:x(i),y:H-6,'text-anchor':'middle','font-size':10,fill:'var(--ink-3)'}); tx.textContent=d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); svg.appendChild(tx);} });
  let dLine=''; values.forEach((v,i)=>{ dLine+=(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '; });
  const gid='lc'+Math.random().toString(36).slice(2,7);
  const defs=el('defs',{}), lg=el('linearGradient',{id:gid,x1:0,y1:0,x2:0,y2:1});
  lg.appendChild(el('stop',{offset:'0%','stop-color':'var(--brand-accent)','stop-opacity':'0.24'}));
  lg.appendChild(el('stop',{offset:'100%','stop-color':'var(--brand-accent)','stop-opacity':'0'}));
  defs.appendChild(lg); svg.appendChild(defs);
  svg.appendChild(el('path',{d:dLine+`L ${x(values.length-1)} ${m.t+ih} L ${x(0)} ${m.t+ih} Z`,fill:`url(#${gid})`}));
  svg.appendChild(el('path',{d:dLine,fill:'none',stroke:'var(--brand-accent)','stroke-width':2,'stroke-linejoin':'round'}));
  const hov=el('line',{x1:0,y1:m.t,x2:0,y2:m.t+ih,stroke:'var(--ink-3)','stroke-width':1,'stroke-dasharray':'3 3',opacity:0});
  const dot=el('circle',{r:4,fill:'var(--brand-accent)',stroke:'var(--panel)','stroke-width':2,opacity:0});
  svg.appendChild(hov); svg.appendChild(dot);
  const tip=document.getElementById('tip');
  svg.addEventListener('mousemove',ev=>{ const r=svg.getBoundingClientRect(), px=(ev.clientX-r.left)*(W/r.width);
    let i=clampNum(Math.round(((px-m.l)/iw)*(values.length-1)),0,values.length-1);
    hov.setAttribute('x1',x(i)); hov.setAttribute('x2',x(i)); hov.setAttribute('opacity',1);
    dot.setAttribute('cx',x(i)); dot.setAttribute('cy',y(values[i])); dot.setAttribute('opacity',1);
    tip.style.opacity=1; tip.style.left=(ev.clientX+12)+'px'; tip.style.top=(ev.clientY-34)+'px';
    tip.innerHTML=`<b>${fmtVal(values[i])}</b> · ${days[i].toLocaleDateString('en-US',{month:'short',day:'numeric'})}`; });
  svg.addEventListener('mouseleave',()=>{ hov.setAttribute('opacity',0); dot.setAttribute('opacity',0); tip.style.opacity=0; });
  container.appendChild(svg);
}

/* ================= (6) render ================= */
const KPIS = [
  { key:'salesUSD', label:'Sales', fmt:usdK },
  { key:'closedAvgSale', label:'Closed Avg', fmt:usd0 },
  { key:'oppJobAvg', label:'Opp Job Avg', fmt:usd0 },
  { key:'opps', label:'Opportunities', fmt:int },
  { key:'wins', label:'Converted', fmt:int },
  { key:'closeRate', label:'Close Rate', fmt:pct, rate:true },
];
let STATE = { range:'month', custom:{from:null,to:null}, lastUpdated:new Date() };
const rateClass = r => r>=0.38?'good':r>=0.30?'warn':'bad';
const healthColor = c => c==='good'?'var(--good)':c==='warn'?'var(--warn)':'var(--bad)';
function deltaHTML(d){ if(Math.abs(d)<0.001) return `<span class="d flat">— 0%</span>`;
  const cls=d>0?'up':'down', a=d>0?'▲':'▼'; return `<span class="d ${cls}">${a} ${Math.abs(d*100).toFixed(0)}%</span>`; }
function badgeHTML(loc){ return loc.logoUrl ? `<img src="${loc.logoUrl}" alt="${loc.name} logo">` : loc.code; }

function kpiCells(k){ return `<div class="kpi ${k.rate?'rate':''}"><div class="kl">${k.label}</div></div>`; }

function render(){
  const win = windowFor(STATE.range, STATE.custom);
  document.getElementById('periodLabel').textContent = win.labelFull;

  const rowsData = LOCATIONS.map(loc=>{
    const series = Adapter.source.getDailySeries(loc);
    return { loc, cur:aggregate(series,win.from,win.to), prev:aggregate(series,win.prevFrom,win.prevTo),
      spark:series.slice(-90).map(d=>d.revenueUSD), series };
  });

  // company totals + a synthetic company daily series for the hero sparkline
  const N = rowsData[0].series.length;
  const compDaily = new Array(N).fill(0);
  rowsData.forEach(r=>r.series.forEach((d,i)=>compDaily[i]+=d.revenueUSD));
  const tot = rowsData.reduce((a,r)=>{ a.salesUSD+=r.cur.salesUSD; a.revenueUSD+=r.cur.revenueUSD; a.opps+=r.cur.opps; a.wins+=r.cur.wins; a.pipeline+=r.cur.oppJobAvg*r.cur.opps; return a; }, {salesUSD:0,revenueUSD:0,opps:0,wins:0,pipeline:0});
  const tp = rowsData.reduce((a,r)=>{ a.salesUSD+=r.prev.salesUSD; a.revenueUSD+=r.prev.revenueUSD; a.opps+=r.prev.opps; a.wins+=r.prev.wins; a.pipeline+=r.prev.oppJobAvg*r.prev.opps; return a; }, {salesUSD:0,revenueUSD:0,opps:0,wins:0,pipeline:0});
  const compCur = { salesUSD:tot.salesUSD, revenueUSD:tot.revenueUSD, opps:tot.opps, wins:tot.wins, closeRate:tot.opps?tot.wins/tot.opps:0, closedAvgSale:tot.wins?tot.salesUSD/tot.wins:0, oppJobAvg:tot.opps?tot.pipeline/tot.opps:0 };
  const compPrev = { salesUSD:tp.salesUSD, revenueUSD:tp.revenueUSD, opps:tp.opps, wins:tp.wins, closeRate:tp.opps?tp.wins/tp.opps:0, closedAvgSale:tp.wins?tp.salesUSD/tp.wins:0, oppJobAvg:tp.opps?tp.pipeline/tp.opps:0 };

  const grid = document.getElementById('grid'); grid.innerHTML='';

  // ----- hero (company) card -----
  grid.appendChild(makeCard({
    hero:true, badge:'P', name:'All Locations', region:`${LOCATIONS.length} franchises · company-wide`,
    cur:compCur, prev:compPrev, spark:compDaily.slice(-90), sparkColor:'rgba(255,255,255,.9)', idx:-1
  }));

  // ----- location cards -----
  rowsData.forEach((r,idx)=>{
    grid.appendChild(makeCard({
      hero:false, loc:r.loc, badge:badgeHTML(r.loc), name:r.loc.name, region:r.loc.region,
      cur:r.cur, prev:r.prev, spark:r.spark, idx
    }));
  });

  window.__rowsData = rowsData;
  STATE.lastUpdated = new Date(); updateAgo();
}

function makeCard(o){
  const card = document.createElement('div');
  card.className = 'card'+(o.hero?' hero':'');
  const rc = rateClass(o.cur.closeRate);
  card.style.setProperty('--health', o.hero?'var(--brand-accent)':healthColor(rc));
  const d = delta(o.cur.revenueUSD, o.prev.revenueUSD);

  card.innerHTML = `
    <div class="c-head">
      <div class="badge">${o.badge}</div>
      <div class="c-name"><b>${o.name}</b><span>${o.region}</span></div>
      <span class="health ${rc}"><span class="hd"></span>${pct(o.cur.closeRate)}</span>
    </div>
    <div class="c-primary">
      <span class="big num">${usdK(o.cur.revenueUSD)}</span>
      <span class="plabel">Revenue</span>
      ${deltaHTML(d)}
    </div>
    <div class="kpis">
      ${KPIS.map(k=>{
        let cls='kv'; if(k.rate) cls+=' '+rateClass(o.cur.closeRate);
        return `<div class="kpi ${k.rate?'rate':''}"><div class="kl">${k.label}</div><div class="${cls} num">${k.fmt(o.cur[k.key])}</div></div>`;
      }).join('')}
    </div>
    <div class="c-spark">
      <div class="sl"><span>90-day revenue</span><span>${o.hero?'company':'trend'}</span></div>
      <div class="spark-holder"></div>
    </div>`;
  // width for sparkline viewBox; actual svg is 100% width so use a nominal ratio
  card.querySelector('.spark-holder').appendChild(sparkline(o.spark, 260, 38, o.sparkColor));
  card.addEventListener('click', ()=>{ if(o.idx>=0) openDetail(o.idx); });
  if (o.idx<0) card.style.cursor='default';
  return card;
}

/* ================= detail drawer ================= */
let detailIdx=0, detailMetric='revenue';
const METRIC_DEF = {
  revenue:{ pick:d=>d.revenueUSD, fmt:usdK }, sales:{ pick:d=>d.salesUSD, fmt:usdK },
  opps:{ pick:d=>d.opps, fmt:int }, wins:{ pick:d=>d.wins, fmt:int }, rate:{ pick:d=>d.opps?d.wins/d.opps:0, fmt:pct },
};
const DKPIS = [
  {key:'revenueUSD',label:'Revenue',fmt:usdK},{key:'salesUSD',label:'Sales',fmt:usdK},
  {key:'closedAvgSale',label:'Closed Avg',fmt:usd0},{key:'oppJobAvg',label:'Opp Job Avg',fmt:usd0},
  {key:'opps',label:'Opportunities',fmt:int},{key:'wins',label:'Converted',fmt:int},
  {key:'closeRate',label:'Close Rate',fmt:pct},
];
function openDetail(idx){
  detailIdx=idx; const r=window.__rowsData[idx];
  document.getElementById('dBadge').innerHTML = badgeHTML(r.loc);
  document.getElementById('dName').textContent = r.loc.name;
  document.getElementById('dId').textContent = `${r.loc.region} · ServiceTitan tenant ${r.loc.tenant}`;
  const dt=document.getElementById('dTiles'); dt.innerHTML='';
  DKPIS.forEach(k=>{ const t=document.createElement('div'); t.className='dtile';
    t.innerHTML=`<div class="kl">${k.label}</div><div class="kv num">${k.fmt(r.cur[k.key])}</div>`; dt.appendChild(t); });
  drawDetailChart();
  const dlg=document.getElementById('detail'); if(!dlg.open) dlg.showModal();
}
function drawDetailChart(){ const r=window.__rowsData[detailIdx], last90=r.series.slice(-90), md=METRIC_DEF[detailMetric];
  lineChart(document.getElementById('dChart'), last90.map(d=>d.t), last90.map(md.pick), md.fmt); }
document.getElementById('dMetric').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return;
  detailMetric=b.dataset.m; document.querySelectorAll('#dMetric button').forEach(x=>x.setAttribute('aria-pressed',x===b)); drawDetailChart(); });
document.getElementById('dClose').addEventListener('click',()=>document.getElementById('detail').close());

/* ================= controls ================= */
document.querySelector('.seg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return;
  STATE.range=b.dataset.range; document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  document.getElementById('customBox').classList.toggle('on', STATE.range==='custom');
  if(STATE.range==='custom' && !STATE.custom.from){ const iso=d=>d.toISOString().slice(0,10);
    STATE.custom={from:iso(new Date(Date.now()-29*DAY_MS)),to:iso(new Date())};
    document.getElementById('cFrom').value=STATE.custom.from; document.getElementById('cTo').value=STATE.custom.to; }
  render(); });
document.getElementById('cFrom').addEventListener('change',e=>{ STATE.custom.from=e.target.value; if(STATE.range==='custom') render(); });
document.getElementById('cTo').addEventListener('change',e=>{ STATE.custom.to=e.target.value; if(STATE.range==='custom') render(); });
document.getElementById('themeBtn').addEventListener('click',()=>{ const root=document.documentElement;
  const cur=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  root.setAttribute('data-theme',cur==='dark'?'light':'dark'); render(); if(document.getElementById('detail').open) drawDetailChart(); });

/* ================= clock + hourly refresh ================= */
function tickClock(){ const now=new Date();
  document.getElementById('clock').textContent=now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  document.getElementById('date').textContent=now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }
function updateAgo(){ const s=Math.floor((Date.now()-STATE.lastUpdated.getTime())/1000);
  document.getElementById('updatedAgo').textContent = s<60?'just now':s<3600?`${Math.floor(s/60)} min ago`:`${Math.floor(s/3600)} hr ago`; }
const REFRESH_MS=60*60*1000; let nextRefresh=Date.now()+REFRESH_MS;
function tickCountdown(){ let ms=nextRefresh-Date.now(); if(ms<=0){ doRefresh(); ms=REFRESH_MS; }
  const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000);
  document.getElementById('countdown').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
function doRefresh(){ nextRefresh=Date.now()+REFRESH_MS; const b=document.getElementById('refreshBtn');
  b.classList.add('spin'); setTimeout(()=>b.classList.remove('spin'),800); Adapter.refresh().then(render); }
document.getElementById('refreshBtn').addEventListener('click',doRefresh);

/* ================= (7) Adapter — the only data seam =================
   Today: MockSource. Live: point `source` at a client that calls YOUR backend,
   e.g. getDailySeries(loc) → fetch(`/api/locations/${loc.tenant}/daily`).
   The backend holds the ServiceTitan cid./cs1. secrets, pulls hourly, and stores
   daily snapshots this page reads. Secrets never ship here. See README. */
const Adapter = { source: MockSource, async refresh(){ return true; } };

/* ================= boot ================= */
tickClock(); render();
setInterval(tickClock,1000); setInterval(updateAgo,15000); setInterval(tickCountdown,1000);
window.addEventListener('resize', ()=>{ if(document.getElementById('detail').open) drawDetailChart(); });
</script>
